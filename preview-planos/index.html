<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Preview de planos de buses - Vibe Transit</title>
<!-- Tailwind CSS v3 CDN (mismo setup que seleccionar-asiento-bus2.html) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            whatsapp: {
              green: '#25d366',
              dark: '#121b22',
              card: '#1f2c34',
              surface: '#0b141a'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      margin: 0;
      background-color: #0b141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      min-height: 100vh;
    }
    #sidebar {
      width: 300px;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    .plantilla-item.active {
      background: #1f2c34;
      border-left-color: #25d366 !important;
      color: #25d366;
    }
    #bus-grid {
      display: grid;
      gap: 6px;
      max-width: 340px;
      margin: 0 auto;
    }
    #bus-grid.horizontal { max-width: none; }
    .bus-map-container::-webkit-scrollbar { width: 4px; }
    .bus-map-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
</style>
</head>
<body>
<!-- BEGIN: Sidebar (herramienta interna, no forma parte del flujo real) -->
<div id="sidebar" class="bg-whatsapp-dark border-r border-gray-800">
<header class="sticky top-0 z-10 bg-[#202c33] px-4 py-3 border-b border-gray-700/30">
<h1 class="text-sm font-bold text-whatsapp-green">Planos de buses</h1>
<p class="text-[10px] text-gray-400">webtestcomercial.jelaf.com</p>
</header>
<div id="servicio-list"></div>
</div>
<!-- END: Sidebar -->
<div class="flex-1 flex flex-col" id="main-shell">
<!-- BEGIN: WebviewHeader (mismo estilo que seleccionar-asiento-bus2.html) -->
<header class="sticky top-0 z-20 bg-[#202c33] px-4 py-2 flex items-center justify-between text-gray-300 text-sm border-b border-gray-700/30">
<div class="flex items-center gap-4">
<span class="font-medium text-white">OK</span>
<span class="text-[10px] text-gray-400 flex items-center gap-1">
<svg class="w-2.5 h-2.5" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path></svg>
          webtestcomercial.jelaf.com
        </span>
</div>
</header>
<!-- END: WebviewHeader -->
<div id="main" class="flex-1 p-6 overflow-auto">
<div id="status" class="text-sm text-gray-400">Cargando planos_buses/...</div>
</div>
</div>
<script>
    // Un archivo por servicio, tal como quedó organizada la carpeta.
    const ARCHIVOS = [
      "ejecutivo.json",
      "emperador.json",
      "emp_vip.json",
      "premium.json",
      "golden_suite.json",
      "emp_plus.json"
    ];

    const sidebarList = document.getElementById("servicio-list");
    const main = document.getElementById("main");

    // Se preseeden las 6 categorías conocidas para que aparezcan en la
    // lista aunque todavía no tengan ninguna plantilla mapeada (ej. EMP PLUS).
    let plantillasPorServicio = {
      "EJECUTIVO": [],
      "EMPERADOR": [],
      "EMP VIP": [],
      "PREMIUM": [],
      "GOLDEN SUITE": [],
      "EMP PLUS": []
    };
    let plantillaActiva = null;

    async function cargarTodo() {
      for (const archivo of ARCHIVOS) {
        try {
          const res = await fetch(`../planos_buses/${archivo}`, { cache: "no-store" });
          if (!res.ok) throw new Error(`${archivo}: HTTP ${res.status}`);
          const datos = await res.json();
          const placasPorCodigo = {};
          Object.entries(datos.placas || {}).forEach(([placa, cod]) => {
            (placasPorCodigo[cod] = placasPorCodigo[cod] || []).push(placa);
          });
          Object.entries(datos.plantillas || {}).forEach(([codigo, plano]) => {
            const servicio = plano.servicio || archivo;
            (plantillasPorServicio[servicio] = plantillasPorServicio[servicio] || []).push({
              codigo,
              plano,
              placas: placasPorCodigo[codigo] || []
            });
          });
        } catch (err) {
          console.error(err);
        }
      }
      renderSidebar();
      const primero = Object.values(plantillasPorServicio).find(list => list.length > 0);
      if (primero && primero[0]) {
        seleccionar(primero[0].codigo);
      } else {
        document.getElementById("status").textContent =
          "No se pudo cargar ningún plano. ¿Estás sirviendo esta carpeta con un servidor local (no file://)?";
      }
    }

    function renderSidebar() {
      sidebarList.innerHTML = "";
      Object.entries(plantillasPorServicio).forEach(([servicio, items]) => {
        const group = document.createElement("div");
        group.className = "border-b border-gray-800/60";
        group.innerHTML = `<h2 class="text-[11px] uppercase tracking-wide text-gray-500 px-4 pt-3 pb-1">${servicio}</h2>`;

        items.forEach(({ codigo, placas }) => {
          const item = document.createElement("div");
          item.className = "plantilla-item px-4 py-2 cursor-pointer text-[13px] border-l-[3px] border-transparent hover:bg-whatsapp-card/60";
          item.dataset.codigo = codigo;
          item.innerHTML = `
            <div class="text-gray-200">${codigo}</div>
            <div class="text-[11px] text-gray-500 mt-0.5">${placas.length ? placas.join(", ") : "sin placas asignadas"}</div>
          `;
          item.addEventListener("click", () => seleccionar(codigo));
          group.appendChild(item);
        });

        if (items.length === 0) {
          group.innerHTML += '<p class="px-4 pb-3 text-[12px] text-gray-500 italic">(sin plantillas todavía)</p>';
        }

        sidebarList.appendChild(group);
      });
    }

    function buscarPlantilla(codigo) {
      for (const items of Object.values(plantillasPorServicio)) {
        const found = items.find(i => i.codigo === codigo);
        if (found) return found;
      }
      return null;
    }

    function seleccionar(codigo) {
      plantillaActiva = codigo;
      document.querySelectorAll(".plantilla-item").forEach(el => {
        el.classList.toggle("active", el.dataset.codigo === codigo);
      });
      renderMain();
    }

    // Mismos iconos (y mismo estilo) que usa seleccionar-asiento-bus2.html.
    const ICONS = {
      tv: `<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
      stairs: `<svg class="w-5 h-5 text-gray-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 13L9 7M9 7H6.5M9 7V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20V17H8V14H12V11H16V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      bath: `<svg class="w-5 h-5 text-gray-600" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="m19,9.393v-5.393h1.5c.276,0,.5-.224.5-.5s-.224-.5-.5-.5h-1.536c-.243-1.694-1.704-3-3.464-3h-7c-1.93,0-3.5,1.57-3.5,3.5v5.893c-1.17.64-2,1.68-2,2.607,0,2.346,2.178,6.076,6.961,6.843-.273,1.133-1.888,1.157-1.961,1.157-1.103,0-2,.897-2,2s.897,2,2,2h8c1.103,0,2-.897,2-2s-.897-2-2-2c-.075,0-1.691-.014-1.961-1.157,4.784-.766,6.961-4.112,6.961-6.843,0-.927-.83-1.966-2-2.607ZM6,3.5c0-1.379,1.121-2.5,2.5-2.5h7c1.379,0,2.5,1.121,2.5,2.5v5.5H6V3.5Zm10,17.5c.552,0,1,.448,1,1s-.448,1-1,1h-8c-.552,0-1-.448-1-1s.448-1,1-1c.952,0,2.682-.44,2.961-2.04.335.026.681.04,1.039.04s.704-.014,1.039-.04c.279,1.6,2.009,2.04,2.961,2.04Zm-4-3c-4.34,0-6.802-2.121-7.655-4.21,1.465.784,4.085,1.21,7.655,1.21,3.345,0,5.998-.196,7.534-.936-.951,1.997-3.384,3.936-7.534,3.936Zm0-4c-5.869,0-8-1.196-8-2,0-.535.791-1.541,2.084-2h11.832c1.293.459,2.084,1.465,2.084,2,0,1.402-2.393,2-8,2Z"/></svg>`
    };

    // Vertical = misma transposicion que usa la pantalla real "Elige tu
    // asiento" (frente del bus arriba, pasillo al centro). Horizontal =
    // tal cual esta guardado en el JSON (igual que el croquis del Excel).
    let orientacion = "vertical";

    function transponerAVertical(rows) {
      const numCols = Math.max(...rows.map(r => r.length));
      const vertical = [];
      for (let c = 0; c < numCols; c++) {
        const filaVertical = [];
        // Se recorre de abajo hacia arriba (r invertido) para reflejar
        // izquierda<->derecha: lo que antes salía a la izquierda de la
        // fila ahora sale a la derecha, y viceversa.
        for (let r = rows.length - 1; r >= 0; r--) {
          filaVertical.push(rows[r][c] || { type: "empty" });
        }
        vertical.push(filaVertical);
      }
      return vertical;
    }

    function renderMain() {
      const item = buscarPlantilla(plantillaActiva);
      if (!item) return;
      const { codigo, plano, placas } = item;

      main.innerHTML = `
        <div class="text-center mb-4">
          <h1 class="text-xl font-bold">${plano.servicio}</h1>
          <p class="text-xs text-gray-400 uppercase tracking-wide">${codigo}</p>
        </div>
        <div class="flex justify-center gap-2 mb-4">
          <button class="toggle-btn text-xs font-bold px-4 py-2 rounded-lg transition-all" data-orientacion="vertical">Vertical (interfaz real)</button>
          <button class="toggle-btn text-xs font-bold px-4 py-2 rounded-lg transition-all" data-orientacion="horizontal">Horizontal (Excel)</button>
        </div>
        <p class="text-center text-xs text-gray-500 mb-6"><b class="text-gray-300">${placas.length}</b> placa(s): ${placas.join(", ") || "ninguna asignada todavía"}</p>
        <div id="pisos-container"></div>
        <div class="flex justify-center items-center gap-6 mt-8 text-[11px] text-gray-400">
          <span class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-whatsapp-card border border-gray-700"></span> Asiento</span>
          <span class="flex items-center gap-2">${ICONS.stairs} Escalera</span>
          <span class="flex items-center gap-2">${ICONS.bath} Baño</span>
          <span class="flex items-center gap-2">${ICONS.tv} TV</span>
        </div>
      `;

      main.querySelectorAll(".toggle-btn").forEach(btn => {
        const active = btn.dataset.orientacion === orientacion;
        btn.className = `toggle-btn text-xs font-bold px-4 py-2 rounded-lg transition-all ${active ? 'bg-whatsapp-green text-black shadow-lg shadow-whatsapp-green/20' : 'bg-whatsapp-card text-gray-400 border border-gray-700'}`;
        btn.addEventListener("click", () => {
          orientacion = btn.dataset.orientacion;
          renderMain();
        });
      });

      const container = document.getElementById("pisos-container");
      const pisos = Object.keys(plano.pisos).sort();
      pisos.forEach(piso => {
        const data = plano.pisos[piso];
        const filas = orientacion === "vertical" ? transponerAVertical(data.rows) : data.rows;
        const totalAsientos = data.rows.reduce(
          (sum, row) => sum + row.filter(c => c.type === "seat").length, 0
        );

        const block = document.createElement("div");
        block.className = "bg-whatsapp-dark/50 border border-gray-800 rounded-3xl p-4 relative mb-8 max-w-2xl mx-auto";
        block.innerHTML = `
          <h3 class="text-center text-[11px] font-bold uppercase tracking-widest text-whatsapp-green mb-3">Piso ${piso} — ${totalAsientos} asientos</h3>
          ${orientacion === "vertical" ? '<p class="text-center text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-3">▲ Frente del bus</p>' : ''}
        `;

        const grid = document.createElement("div");
        grid.id = `bus-grid-${piso}`;
        grid.className = orientacion === "vertical" ? "" : "horizontal";
        grid.style.display = "flex";
        grid.style.flexDirection = "column";
        grid.style.gap = "6px";
        if (orientacion === "vertical") {
          grid.style.maxWidth = "340px";
          grid.style.margin = "0 auto";
        }

        filas.forEach(row => {
          const rowDiv = document.createElement("div");
          rowDiv.style.display = "flex";
          rowDiv.style.gap = "6px";
          rowDiv.style.justifyContent = orientacion === "vertical" ? "stretch" : "center";
          row.forEach(cell => {
            const cellDiv = document.createElement("div");
            cellDiv.style.flex = "1";
            cellDiv.style.maxWidth = orientacion === "vertical" ? "none" : "56px";
            if (cell.type === "seat") {
              cellDiv.className = "aspect-[4/5] rounded-lg flex flex-col items-center justify-center bg-whatsapp-card border border-gray-700";
              cellDiv.innerHTML = `
                <span class="text-sm font-black leading-none text-gray-200">${cell.id}</span>
                ${cell.angle ? `<span class="text-[9px] mt-1 text-gray-500">${cell.angle}°</span>` : ""}
              `;
            } else if (cell.type === "tv" || cell.type === "stairs" || cell.type === "bath") {
              cellDiv.className = "aspect-[4/5] flex items-center justify-center";
              cellDiv.innerHTML = ICONS[cell.type];
            } else if (cell.type === "label") {
              // Compatibilidad por si queda algún label suelto (LI/CU ya
              // se descartaron y EE/BA ya se reemplazaron por íconos).
              cellDiv.className = "aspect-[4/5] rounded-lg flex items-center justify-center bg-gray-100/5 border border-gray-700";
              cellDiv.innerHTML = `<span class="text-[10px] font-bold text-gray-400">${cell.text || ""}</span>`;
            } else {
              cellDiv.className = "aspect-[4/5]";
            }
            rowDiv.appendChild(cellDiv);
          });
          grid.appendChild(rowDiv);
        });

        block.appendChild(grid);
        container.appendChild(block);
      });
    }

    cargarTodo();
  </script>
</body>
</html>
