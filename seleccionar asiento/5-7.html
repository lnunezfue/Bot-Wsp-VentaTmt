<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Vibe Transit - Seat Selection</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            whatsapp: {
              green: '#25d366',
              dark: '#121b22',
              card: '#1f2c34',
              surface: '#0b141a'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      background-color: #0b141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar for the bus layout area */
    .bus-map-container::-webkit-scrollbar {
      width: 4px;
    }
    .bus-map-container::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 10px;
    }
    /* Glass effect for bottom button */
    .confirm-container {
      background: linear-gradient(to top, #0b141a 80%, transparent);
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<!-- BEGIN: WebviewHeader -->
<header class="bg-[#202c33] px-4 py-2 flex items-center justify-between text-gray-300 text-sm border-b border-gray-700/30">
<div class="flex items-center gap-4">
<span class="font-medium text-white">OK</span>
<div class="flex flex-col">
<span class="text-[10px] text-gray-400 flex items-center gap-1">
<svg class="w-2.5 h-2.5" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path></svg>
          webtestcomercial.jelaf.com
        </span>
</div>
</div>
<div class="flex gap-1">
<div class="w-1 h-1 bg-gray-400 rounded-full"></div>
<div class="w-1 h-1 bg-gray-400 rounded-full"></div>
<div class="w-1 h-1 bg-gray-400 rounded-full"></div>
</div>
</header>
<!-- END: WebviewHeader -->
<main class="flex-1 flex flex-col overflow-hidden">
<!-- BEGIN: TitleSection -->
<div class="pt-6 pb-4 text-center px-4 shrink-0" data-purpose="trip-info">
<h1 class="text-xl font-bold mb-1">Elige tu asiento</h1>
<p class="text-xs text-gray-400 uppercase tracking-wide">
        Lima → Tacna | Lun. 25 May. 2026 | 11:02 PM
      </p>
</div>
<!-- END: TitleSection -->
<!-- BEGIN: FloorSwitcher -->
<div class="px-6 mb-6 shrink-0" data-purpose="floor-tabs">
<div class="flex bg-whatsapp-dark p-1 rounded-xl border border-gray-800">
<button class="flex-1 py-3 px-4 rounded-lg text-sm font-semibold text-gray-400 transition-all" id="floor-1-btn">
          1er Piso
        </button>
<button class="flex-1 py-3 px-4 rounded-lg text-sm font-bold bg-whatsapp-green text-black transition-all shadow-lg shadow-whatsapp-green/20" id="floor-2-btn">
          2do Piso
        </button>
</div>
</div>
<!-- END: FloorSwitcher -->
<!-- BEGIN: BusLayoutContainer -->
<div class="flex-1 overflow-y-auto px-6 pb-24 bus-map-container" data-purpose="seating-area">
<div class="bg-whatsapp-dark/50 border border-gray-800 rounded-3xl p-6 relative" id="bus-layout">
<!-- Rendered dynamically by script -->
</div>
</div>
<!-- END: BusLayoutContainer -->
<!-- BEGIN: BottomLegendAndConfirmation -->
<div class="fixed bottom-0 left-0 right-0 z-10 confirm-container pt-4">
<!-- Legend -->
<div class="flex justify-center items-center gap-6 mb-4 text-[10px] font-bold uppercase tracking-wider text-gray-400 bg-whatsapp-dark/80 backdrop-blur-sm py-2 mx-6 rounded-full border border-gray-800">
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
          Libre
        </div>
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
          Ocupado
        </div>
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-whatsapp-green"></div>
          Tuyo
        </div>
</div>
<!-- Price Summary -->
<div class="flex justify-between items-center px-8 mb-2">
<div class="flex flex-col">
<span class="text-[10px] text-gray-500 font-bold uppercase" id="passenger-label">Selecciona asientos</span>
<span class="text-xs text-gray-300" id="selected-seats-display">Piso 2 - Ninguno</span>
</div>
<div class="text-right">
<span class="text-lg font-bold text-white" id="total-price">S/ 0</span>
</div>
</div>
<!-- Action Button -->
<div class="px-4 pb-6">
<button class="w-full bg-whatsapp-green py-4 rounded-xl text-black font-black text-lg active:scale-95 transition-transform shadow-xl shadow-whatsapp-green/30 disabled:opacity-50 disabled:grayscale" disabled="" id="confirm-btn">
          Confirmar
        </button>
</div>
</div>
<!-- END: BottomLegendAndConfirmation -->
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Data Definition ---
      const busData = {
        1: {
          price: 50,
          rows: [
            [{type: 'occupied'}, {type: 'occupied'}, {type: 'tv'}, {type: 'occupied'}],
            [{type: 'occupied'}, {type: 'occupied'}, {type: 'empty'}, {type: 'occupied'}],
            [{type: 'occupied'}, {type: 'occupied'}, {type: 'empty'}, {type: 'stairs'}],
            [{type: 'seat', id: '01', angle: '140'}, {type: 'occupied'}, {type: 'empty'}, {type: 'seat', id: '02', angle: '140'}]
          ]
        },
        2: {
          price: 70,
          rows: [
            [{type: 'seat', id: '01', angle: '145'}, {type: 'seat', id: '02', angle: '145'}, {type: 'tv'}, {type: 'seat', id: '03', angle: '145'}],
            [{type: 'seat', id: '05', angle: '140'}, {type: 'seat', id: '06', angle: '140'}, {type: 'exit'}, {type: 'exit'}],
            [{type: 'seat', id: '09', angle: '140'}, {type: 'seat', id: '10', angle: '140'}, {type: 'empty'}, {type: 'stairs'}],
            [{type: 'seat', id: '13', angle: '140'}, {type: 'seat', id: '14', angle: '140'}, {type: 'seat', id: '15', angle: '140'}, {type: 'seat', id: '16', angle: '140'}],
            [{type: 'seat', id: '17', angle: '140'}, {type: 'seat', id: '18', angle: '140'}, {type: 'tv'}, {type: 'seat', id: '19', angle: '140'}]
          ]
        }
      };

      // --- State ---
      let currentFloor = 2;
      let selectedSeats = []; // Array of { floor, id, price }

      // --- Selectors ---
      const floor1Btn = document.getElementById('floor-1-btn');
      const floor2Btn = document.getElementById('floor-2-btn');
      const busLayout = document.getElementById('bus-layout');
      const passengerLabel = document.getElementById('passenger-label');
      const selectedSeatsDisplay = document.getElementById('selected-seats-display');
      const totalPriceDisplay = document.getElementById('total-price');
      const confirmBtn = document.getElementById('confirm-btn');

      // --- Functions ---
      function updateUI() {
        // Update tabs
        [floor1Btn, floor2Btn].forEach((btn, idx) => {
          const isFloorActive = (idx + 1) === currentFloor;
          if (isFloorActive) {
            btn.className = "flex-1 py-3 px-4 rounded-lg text-sm font-bold bg-whatsapp-green text-black transition-all shadow-lg shadow-whatsapp-green/20";
          } else {
            btn.className = "flex-1 py-3 px-4 rounded-lg text-sm font-semibold text-gray-400 transition-all";
          }
        });

        renderBus();
        updateSummary();
      }

      function updateSummary() {
        const count = selectedSeats.length;
        const total = selectedSeats.reduce((sum, s) => sum + s.price, 0);
        
        if (count === 0) {
          passengerLabel.textContent = "Selecciona asientos";
          selectedSeatsDisplay.textContent = `Piso ${currentFloor} - Ninguno`;
          totalPriceDisplay.textContent = "S/ 0";
          confirmBtn.textContent = "Confirmar";
          confirmBtn.disabled = true;
        } else {
          passengerLabel.textContent = `Pasajero${count > 1 ? 's' : ''} ${selectedSeats.map((_, i) => i + 1).join(', ')}`;
          const ids = selectedSeats.map(s => s.id).join(', ');
          selectedSeatsDisplay.textContent = `Piso ${currentFloor} - Asiento${count > 1 ? 's' : ''} ${ids}`;
          totalPriceDisplay.textContent = `S/ ${total}`;
          confirmBtn.textContent = `Confirmar ${count} Asiento${count > 1 ? 's' : ''} por S/ ${total}`;
          confirmBtn.disabled = false;
        }
      }

      function toggleSeat(id) {
        const index = selectedSeats.findIndex(s => s.id === id && s.floor === currentFloor);
        if (index > -1) {
          selectedSeats.splice(index, 1);
        } else {
          selectedSeats.push({
            floor: currentFloor,
            id: id,
            price: busData[currentFloor].price
          });
        }
        renderBus();
        updateSummary();
      }

      function renderBus() {
        const floorData = busData[currentFloor];
        busLayout.innerHTML = '';
        
        floorData.rows.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = "grid grid-cols-4 gap-4 mb-4";
          
          row.forEach(cell => {
            const cellDiv = document.createElement('div');
            
            if (cell.type === 'seat') {
              const isSelected = selectedSeats.some(s => s.id === cell.id && s.floor === currentFloor);
              cellDiv.className = `col-span-1 aspect-[3/4] rounded-xl flex flex-col items-center justify-center p-2 cursor-pointer transition-all ${isSelected ? 'bg-whatsapp-green/20 border-2 border-whatsapp-green' : 'bg-whatsapp-card border border-gray-700'}`;
              
              if (isSelected) {
                cellDiv.innerHTML = `
                  <span class="text-[10px] text-whatsapp-green font-semibold">Asiento</span>
                  <span class="text-xl font-black text-whatsapp-green">${cell.id}</span>
                `;
              } else {
                cellDiv.innerHTML = `
                  <div class="flex items-center gap-1 text-[10px] text-gray-400 mb-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    ${cell.angle}°
                  </div>
                  <div class="text-xs font-bold text-gray-300">S/ <span class="text-sm">${floorData.price}</span></div>
                `;
              }
              cellDiv.addEventListener('click', () => toggleSeat(cell.id));
              
            } else if (cell.type === 'occupied') {
              cellDiv.className = "col-span-1 aspect-[3/4] bg-red-500/5 border border-red-500/50 rounded-xl flex items-center justify-center";
              cellDiv.innerHTML = `
                <div class="w-6 h-6 rounded-full border border-red-500/30 flex items-center justify-center opacity-40">
                  <svg class="w-4 h-4 text-red-500" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path></svg>
                </div>
              `;
            } else if (cell.type === 'tv') {
              cellDiv.className = "col-span-1 flex items-center justify-center";
              cellDiv.innerHTML = `<svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`;
            } else if (cell.type === 'exit') {
              cellDiv.className = "col-span-1 flex items-center justify-center";
              cellDiv.innerHTML = `<svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`;
            } else if (cell.type === 'stairs') {
              cellDiv.className = "col-span-1 flex items-center justify-center";
              cellDiv.innerHTML = `<svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`;
            } else {
              cellDiv.className = "col-span-1";
            }
            
            rowDiv.appendChild(cellDiv);
          });
          
          busLayout.appendChild(rowDiv);
        });
      }

      // --- Event Listeners ---
      floor1Btn.addEventListener('click', () => {
        currentFloor = 1;
        updateUI();
      });

      floor2Btn.addEventListener('click', () => {
        currentFloor = 2;
        updateUI();
      });

      // Initial Render
      updateUI();
    });
  </script>
</body></html>
