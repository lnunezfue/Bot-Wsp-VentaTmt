<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Vibe Transit - Elige tu asiento</title>
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            whatsapp: {
              green: '#25d366',
              dark: '#121b22',
              card: '#1f2c34',
              surface: '#0b141a'
            }
          }
        }
      }
    }
  </script>
  
  <style data-purpose="custom-styling">
    body {
      margin: 0;
      background-color: #0b141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }
    .app-shell {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .bus-map-container::-webkit-scrollbar { width: 4px; }
    .bus-map-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    .confirm-container { background: linear-gradient(to top, #0b141a 85%, transparent); }
    .fixed-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 500px;
      margin: 0 auto;
    }
    /* Plano vertical: se arma con N columnas dinámicas (según el ancho real
       del bus que devuelva la API), de frente hacia atrás. */
    #bus-grid {
      display: grid;
      gap: 6px;
      max-width: 340px;
      margin: 0 auto;
    }
  </style>
<script src="config.js?v=2026-10-18b"></script>
</head>
<body>
  <div class="app-shell">

    <!-- BEGIN: TopBar -->
    <header class="flex items-center justify-between px-4 pt-4 shrink-0" data-purpose="top-bar">
      <a href="#" id="btn-back" class="text-whatsapp-green text-sm font-bold flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Atrás
      </a>
    </header>
    <!-- END: TopBar -->

    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- BEGIN: TitleSection -->
      <div class="pt-6 pb-3 text-center px-4 shrink-0" data-purpose="trip-info">
        <h1 class="text-xl font-bold mb-1">Elige tu asiento</h1>
        <p class="text-xs text-gray-400 uppercase tracking-wide" id="trip-subtitle">Cargando viaje...</p>
        <!-- Servicio del bus, destacado (pedido de boletería 2026-10-09) -->
        <div class="hidden mt-3 inline-flex items-center gap-2 bg-whatsapp-green/15 border border-whatsapp-green/50 text-whatsapp-green rounded-full px-4 py-1.5" id="trip-servicio">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h8m-8 4h8M6 3h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2zm1 15v2m10-2v2"/></svg>
          <span class="text-sm font-black uppercase tracking-wider" id="trip-servicio-texto"></span>
        </div>
        <p class="text-[10px] text-gray-600 mt-1.5" id="trip-placa"></p>
      </div>
      <!-- END: TitleSection -->
      
      <!-- BEGIN: FloorTabs -->
      <div class="px-6 mb-4 shrink-0 hidden" id="floor-tabs" data-purpose="floor-tabs">
        <div class="flex bg-whatsapp-dark p-1 rounded-xl border border-gray-800" id="floor-tabs-inner"></div>
      </div>
      <!-- END: FloorTabs -->
      
      <!-- BEGIN: BusLayoutContainer -->
      <div class="flex-1 overflow-y-auto px-4 pb-40 bus-map-container" data-purpose="seating-area">
        <div class="flex flex-col items-center justify-center gap-3 py-16" id="status-message" role="status" aria-live="polite">
          <div class="w-10 h-10 rounded-full border-4 border-gray-700 border-t-whatsapp-green animate-spin" id="status-spinner" aria-hidden="true"></div>
          <p class="text-center text-sm text-gray-400" id="status-text">Consultando asientos disponibles…</p>
        </div>
        <div class="bg-[#1e2f3c] border border-gray-700/60 rounded-3xl p-4 relative hidden" id="bus-layout">
          <p class="text-center text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-3">▲ Frente del bus</p>
          <div id="bus-grid"><!-- Rendered dynamically by script --></div>
          <p class="text-center text-[10px] font-bold uppercase tracking-widest text-gray-500 mt-3">Parte trasera ▼</p>
        </div>
      </div>
      <!-- END: BusLayoutContainer -->
    </main>
    
    <!-- BEGIN: BottomLegendAndConfirmation -->
    <div class="fixed-bottom z-10 confirm-container pt-4">
      <!-- Mientras JELAF bloquea o suelta un asiento (puede tardar unos segundos) -->
      <div class="hidden mx-4 mb-3 flex items-center justify-center gap-2 bg-whatsapp-card border border-whatsapp-green/40 rounded-xl py-2.5 text-sm font-semibold text-whatsapp-green" id="reservando" role="status" aria-live="polite">
        <div class="w-4 h-4 rounded-full border-2 border-whatsapp-green/30 border-t-whatsapp-green animate-spin" aria-hidden="true"></div>
        <span id="reservando-texto">Reservando asiento…</span>
      </div>
      <div class="flex justify-center items-center gap-4 mb-4 text-[9px] font-bold uppercase tracking-wider text-gray-400 bg-whatsapp-dark/80 backdrop-blur-sm py-2 mx-4 rounded-full border border-gray-800 flex-wrap">
        <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-white border border-gray-500"></div>Libre</div>
        <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>Ocupado</div>
        <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-whatsapp-green"></div>Tuyo</div>
      </div>
      
      <div class="flex justify-between items-center px-8 mb-2">
        <div class="flex flex-col">
          <span class="text-[10px] text-gray-500 font-bold uppercase" id="passenger-label">Selecciona asientos</span>
          <span class="text-xs text-gray-300" id="selected-seats-display">Ninguno</span>
        </div>
        <div class="text-right">
          <span class="text-lg font-bold text-white" id="total-price">S/ 0</span>
        </div>
      </div>
      
      <div class="px-4 pb-6">
        <button class="w-full bg-whatsapp-green py-4 rounded-xl text-black font-black text-lg active:scale-95 transition-transform shadow-xl shadow-whatsapp-green/30 disabled:opacity-50 disabled:grayscale" disabled="" id="confirm-btn">
          Confirmar
        </button>
      </div>
    </div>
    <!-- END: BottomLegendAndConfirmation -->

    <!-- Aviso propio de la página (antes era el alert() del navegador, que
         mostraba "La página https://... dice:"). -->
    <div class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 px-4 pb-6" id="aviso" role="alertdialog" aria-modal="true" aria-labelledby="aviso-titulo" aria-describedby="aviso-mensaje">
      <div class="w-full max-w-sm bg-whatsapp-card border border-gray-700 rounded-2xl p-5 shadow-2xl">
        <div class="flex items-start gap-3">
          <div class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center" id="aviso-icono"></div>
          <div class="flex-1 min-w-0">
            <h2 class="text-base font-bold text-white" id="aviso-titulo"></h2>
            <p class="text-sm text-gray-300 mt-1" id="aviso-mensaje"></p>
          </div>
        </div>
        <button class="mt-5 w-full bg-whatsapp-green py-3 rounded-xl text-black font-bold active:scale-95 transition-transform" id="aviso-ok">Entendido</button>
      </div>
    </div>

  </div>

  <script>
    // --- Backend real (api_ventas.py) ---
    const API_BASE_URL = window.TMT.API_BASE_URL;

    // --- Estado del flujo de compra: sessionStorage = una compra por pestaña ---
    const STORAGE_KEY = 'vibeTransitBooking';
    function loadBooking() {
      try { return JSON.parse(sessionStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
    }
    function saveBooking(partial) {
      const updated = Object.assign({}, loadBooking(), partial);
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
      return updated;
    }

    const booking = loadBooking();
    
    // 🛠️ CORRECCIÓN: Leemos "viajeSeleccionado" tal como lo guardamos en elegir-horario.html
    if (!booking.viajeSeleccionado || !booking.busqueda) {
      window.location.href = 'buscar-viaje.html';
    }

    // Actualizamos los títulos con la info correcta
    // Formatear visualmente la fecha de YYYY-MM-DD a DD/MM/YYYY
    const visualDate = booking.busqueda.fecha.includes('-') 
      ? booking.busqueda.fecha.split('-').reverse().join('/') 
      : booking.busqueda.fecha;

    document.getElementById('trip-subtitle').textContent =
      `${booking.busqueda.origen} → ${booking.busqueda.destino} | ${visualDate} | ${booking.viajeSeleccionado.hora_viaje || ''}`.toUpperCase();
    document.getElementById('trip-placa').textContent =
      booking.viajeSeleccionado.placa_bus ? `Placa ${booking.viajeSeleccionado.placa_bus}` : '';
    if (booking.viajeSeleccionado.servicio) {
      document.getElementById('trip-servicio-texto').textContent = booking.viajeSeleccionado.servicio;
      document.getElementById('trip-servicio').classList.remove('hidden');
    }

    // --- Aviso propio (reemplaza a alert()) ---
    const ICONO_AVISO = {
      error: { clase: 'bg-red-500/15 text-red-400', svg: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>' },
      info: { clase: 'bg-whatsapp-green/15 text-whatsapp-green', svg: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' }
    };
    const aviso = document.getElementById('aviso');
    const avisoOk = document.getElementById('aviso-ok');
    let alCerrarAviso = null;
    function avisar(titulo, mensaje, tipo = 'error') {
      const icono = ICONO_AVISO[tipo] || ICONO_AVISO.error;
      document.getElementById('aviso-icono').className = `shrink-0 w-10 h-10 rounded-full flex items-center justify-center ${icono.clase}`;
      document.getElementById('aviso-icono').innerHTML = icono.svg;
      document.getElementById('aviso-titulo').textContent = titulo;
      document.getElementById('aviso-mensaje').textContent = mensaje;
      aviso.classList.remove('hidden');
      avisoOk.focus();
      return new Promise(resolve => { alCerrarAviso = resolve; });
    }
    function cerrarAviso() {
      aviso.classList.add('hidden');
      if (alCerrarAviso) { alCerrarAviso(); alCerrarAviso = null; }
    }
    avisoOk.addEventListener('click', cerrarAviso);
    aviso.addEventListener('click', (e) => { if (e.target === aviso) cerrarAviso(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !aviso.classList.contains('hidden')) cerrarAviso(); });

    // Formato de dinero: "S/ 70" o "S/ 72.50".
    const soles = (n) => `S/ ${Number(n) % 1 === 0 ? Number(n) : Number(n).toFixed(2)}`;

    // --- Identificador de esta venta en el pool de workers JELAF ---
    // Se genera una sola vez por viaje elegido (elegir-horario.html lo limpia si el
    // cliente elige otro viaje) y viaja en cada llamada a /api/v2/venta/...
    // para que el backend sepa qué worker persistente le corresponde.
    if (!booking.bookingId) {
      booking.bookingId = crypto.randomUUID();
      saveBooking({ bookingId: booking.bookingId });
    }
    const bookingId = booking.bookingId;

    // El backend suelta el mostrador a los ~5 min sin señal del cliente; esta
    // pantalla puede durar un rato (mirando el plano), así que avisa cada 30s
    // igual que las pantallas de datos y pago.
    setInterval(() => {
      fetch(`${API_BASE_URL}/api/v2/venta/heartbeat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_id: bookingId })
      }).catch(() => {});
    }, 30000);
    let ventaIniciada = false; // true tras el primer /api/v2/venta/iniciar exitoso

    // Transpone una matriz [fila][columna] a un plano vertical
    function transponerAVertical(rows) {
      const numCols = Math.max(...rows.map(r => r.length));
      const vertical = [];
      for (let c = 0; c < numCols; c++) {
        const filaVertical = [];
        // Igual que en preview-planos: se recorre de abajo hacia arriba
        // (r invertido) para reflejar izquierda<->derecha.
        for (let r = rows.length - 1; r >= 0; r--) {
          filaVertical.push(rows[r][c] || { type: 'empty' });
        }
        vertical.push(filaVertical);
      }
      return vertical;
    }

    // --- Selectors ---
    const statusMessage = document.getElementById('status-message');
    const statusText = document.getElementById('status-text');
    const statusSpinner = document.getElementById('status-spinner');
    const reservando = document.getElementById('reservando');
    const reservandoTexto = document.getElementById('reservando-texto');
    const busLayout = document.getElementById('bus-layout');
    const busGrid = document.getElementById('bus-grid');
    const floorTabs = document.getElementById('floor-tabs');
    const floorTabsInner = document.getElementById('floor-tabs-inner');
    const passengerLabel = document.getElementById('passenger-label');
    const selectedSeatsDisplay = document.getElementById('selected-seats-display');
    const totalPriceDisplay = document.getElementById('total-price');
    const confirmBtn = document.getElementById('confirm-btn');

    let planoPorPiso = {};       // { "1": { price, rows, verticalRows }, "2": {...} }
    let currentFloor = null;
    let selectedSeats = (booking.asientos || []).slice(); // [{ floor, id, price }]

    // La pantalla no adivina si la compra sigue viva: lo pregunta al servidor.
    // Al recargar esta pantalla, `pagehide` cancela la compra (y JELAF suelta
    // los asientos), pero el navegador seguía mostrando el asiento elegido y
    // no volvía a llamar a /iniciar: todo toque posterior fallaba con
    // "compra no activa" y el cliente quedaba atascado.
    async function sincronizarConServidor() {
      if (selectedSeats.length === 0) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/v2/venta/monto`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: bookingId })
        });
        const body = await res.json().catch(() => ({}));
        let enServidor = new Map();
        if (res.ok) {
          enServidor = new Map((body.asientos || []).map(a => [String(a.asiento).padStart(2, '0'), Number(a.precio)]));
          ventaIniciada = true;
        } else if (res.status === 409) {
          ventaIniciada = true;    // compra viva, pero sin asientos
        } else {
          ventaIniciada = false;   // 403: la compra ya no existe en el servidor
        }
        const antes = selectedSeats.length;
        selectedSeats = selectedSeats
          .filter(s => enServidor.has(String(s.id).padStart(2, '0')))
          .map(s => Object.assign({}, s, { price: enServidor.get(String(s.id).padStart(2, '0')) }));
        saveBooking({ asientos: selectedSeats });
        if (selectedSeats.length < antes) {
          avisar('Tu selección se liberó', 'Pasó un tiempo sin actividad y tus asientos se liberaron. Vuelve a elegirlos.', 'info');
        }
      } catch (err) {
        // Sin conexión: se deja como estaba; el próximo toque lo corrige.
      }
    }

    function compraReiniciada(mensaje) {
      selectedSeats = [];
      ventaIniciada = false;
      saveBooking({ asientos: [] });
      renderFloor();
      updateSummary();
      avisar('Tu compra expiró', mensaje, 'info');
    }

    const ICONS = {
      tv: `<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
      exit: `<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
      stairs: `<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
      bath: `<svg class="w-5 h-5 text-gray-600" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="m19,9.393v-5.393h1.5c.276,0,.5-.224.5-.5s-.224-.5-.5-.5h-1.536c-.243-1.694-1.704-3-3.464-3h-7c-1.93,0-3.5,1.57-3.5,3.5v5.893c-1.17.64-2,1.68-2,2.607,0,2.346,2.178,6.076,6.961,6.843-.273,1.133-1.888,1.157-1.961,1.157-1.103,0-2,.897-2,2s.897,2,2,2h8c1.103,0,2-.897,2-2s-.897-2-2-2c-.075,0-1.691-.014-1.961-1.157,4.784-.766,6.961-4.112,6.961-6.843,0-.927-.83-1.966-2-2.607ZM6,3.5c0-1.379,1.121-2.5,2.5-2.5h7c1.379,0,2.5,1.121,2.5,2.5v5.5H6V3.5Zm10,17.5c.552,0,1,.448,1,1s-.448,1-1,1h-8c-.552,0-1-.448-1-1s.448-1,1-1c.952,0,2.682-.44,2.961-2.04.335.026.681.04,1.039.04s.704-.014,1.039-.04c.279,1.6,2.009,2.04,2.961,2.04Zm-4-3c-4.34,0-6.802-2.121-7.655-4.21,1.465.784,4.085,1.21,7.655,1.21,3.345,0,5.998-.196,7.534-.936-.951,1.997-3.384,3.936-7.534,3.936Zm0-4c-5.869,0-8-1.196-8-2,0-.535.791-1.541,2.084-2h11.832c1.293.459,2.084,1.465,2.084,2,0,1.402-2.393,2-8,2Z"/></svg>`
    };

    function updateSummary() {
      const count = selectedSeats.length;
      const total = selectedSeats.reduce((sum, s) => sum + s.price, 0);

      if (count === 0) {
        passengerLabel.textContent = 'Selecciona asientos';
        selectedSeatsDisplay.textContent = 'Ninguno';
        totalPriceDisplay.textContent = 'S/ 0';
        confirmBtn.textContent = 'Confirmar';
        confirmBtn.disabled = true;
      } else {
        passengerLabel.textContent = `Pasajero${count > 1 ? 's' : ''} ${selectedSeats.map((_, i) => i + 1).join(', ')}`;
        selectedSeatsDisplay.textContent = `Asiento${count > 1 ? 's' : ''} ${selectedSeats.map(s => s.id).join(', ')}`;
        totalPriceDisplay.textContent = soles(total);
        confirmBtn.textContent = `Confirmar ${count} Asiento${count > 1 ? 's' : ''} por ${soles(total)}`;
        confirmBtn.disabled = pendiente !== null;
      }
    }

    // Evita doble clic mientras hay una petición al worker JELAF en vuelo.
    let procesandoAsiento = false;
    // Asiento que se está reservando o soltando en JELAF: { floor, id, accion }.
    // Bloquear puede tardar unos segundos; sin esto el cliente no sabía si el
    // toque había funcionado y volvía a tocar.
    let pendiente = null;
    function marcarPendiente(valor) {
      pendiente = valor;
      if (valor) {
        reservandoTexto.textContent = valor.accion === 'soltar'
          ? `Liberando asiento ${valor.id}…` : `Reservando asiento ${valor.id}…`;
        reservando.classList.remove('hidden');
      } else {
        reservando.classList.add('hidden');
      }
      if (currentFloor) renderFloor();
      updateSummary();
    }

    function extraerError(body, fallback) {
      if (body && body.detail) return typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
      return fallback;
    }

    // Reserva el worker del pool para esta venta (una sola vez, en el primer
    // asiento tocado) y le hace buscar el viaje real. Si todos los workers
    // están ocupados por otras ventas (423), se lo decimos al cliente en vez
    // de dejarlo tocando un asiento que nunca se va a bloquear de verdad.
    async function iniciarVentaSiHaceFalta() {
      if (ventaIniciada) return true;

      const v = booking.viajeSeleccionado;
      const res = await fetch(`${API_BASE_URL}/api/v2/venta/iniciar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          booking_id: bookingId,
          codi_origen: Number(v.codi_origen),
          fecha_viaje: booking.busqueda.fecha,
          hora_viaje: v.hora_viaje,
          viaje: {
            codi_empresa: Number(v.codi_empresa) || 0,
            codi_destino: Number(v.codi_destino) || 0,
            codi_sucursal: Number(v.codi_sucursal) || 0,
            codi_ruta: Number(v.codi_ruta) || 0,
            codi_punto_venta: Number(v.codi_punto_venta) || 0,
            codi_servicio: Number(v.codi_servicio) || 0
          },
          destino: (booking.busqueda && booking.busqueda.destino) || null,
          placa_bus: v.placa_bus || null,
          contacto: booking.contactoToken || null
        })
      });
      const body = await res.json();

      if (!res.ok) {
        if (res.status === 423) {
          avisar('Estamos atendiendo otras compras', 'Espera unos segundos y vuelve a tocar el asiento.', 'info');
        } else {
          avisar('No pudimos iniciar tu compra', extraerError(body, 'Inténtalo de nuevo en unos segundos.'));
        }
        return false;
      }

      ventaIniciada = true;
      return true;
    }

    async function toggleSeat(floor, id, price) {
      if (procesandoAsiento) return;
      const index = selectedSeats.findIndex(s => s.id === id && s.floor === floor);

      // --- Deseleccionar: libera de verdad el asiento en la página del worker ---
      if (index > -1) {
        procesandoAsiento = true;
        marcarPendiente({ floor, id, accion: 'soltar' });
        try {
          const res = await fetch(`${API_BASE_URL}/api/v2/venta/liberar-asiento`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ booking_id: bookingId, numero_asiento: id }),
            keepalive: true
          });
          if (res.status === 403) {
            compraReiniciada('Tu compra expiró por inactividad. Vuelve a elegir tu asiento.');
            return;
          }
          if (!res.ok) {
            // Antes se quitaba igual de la pantalla aunque el servidor lo
            // conservara (p. ej. con el pago en curso): se cobraba un asiento
            // que el cliente ya no veía.
            const body = await res.json().catch(() => ({}));
            avisar('No pudimos quitar el asiento', extraerError(body, 'Inténtalo de nuevo.'));
            return;
          }
          selectedSeats.splice(index, 1);
          saveBooking({ asientos: selectedSeats });
          renderFloor();
          updateSummary();
        } catch (err) {
          avisar('Sin conexión', 'No pudimos quitar el asiento. Revisa tu internet e inténtalo de nuevo.');
        } finally {
          procesandoAsiento = false;
          marcarPendiente(null);
        }
        return;
      }

      // --- Máximo 5 pasajes por compra ---
      if (selectedSeats.length >= 5) {
        avisar('Máximo 5 asientos', 'Puedes elegir hasta 5 asientos por compra.', 'info');
        return;
      }

      // --- Seleccionar: clic real en el worker JELAF (el clic ES el bloqueo) ---
      procesandoAsiento = true;
      marcarPendiente({ floor, id, accion: 'reservar' });
      try {
        if (!(await iniciarVentaSiHaceFalta())) return;

        const res = await fetch(`${API_BASE_URL}/api/v2/venta/seleccionar-asiento`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: bookingId, numero_asiento: id, precio: price })
        });

        const body = await res.json();

        if (res.status === 403) {
          compraReiniciada('Tu compra anterior expiró. Toca de nuevo el asiento para continuar.');
          return;
        }
        if (!res.ok) {
          // Lo más común: otro cliente (o la boletería) lo tomó segundos antes.
          // Se refresca el plano para que el cliente vea ese asiento ya ocupado.
          const ocupado = res.status === 409 || /no est[aá] disponible|ocupado|vendido/i.test(String(body.detail || ''));
          marcarPendiente(null);
          await cargarPlano();
          avisar(ocupado ? `El asiento ${id} ya no está disponible` : 'No pudimos reservar el asiento',
                 ocupado ? 'Otra persona lo acaba de tomar. Elige otro asiento libre del plano.'
                         : extraerError(body, 'Inténtalo de nuevo en unos segundos.'));
          return;
        }

        // El precio que vale es el que calculó el servidor con JELAF.
        const precioServidor = Number(body.precio);
        selectedSeats.push({ floor, id, price: precioServidor > 0 ? precioServidor : price });
        saveBooking({ asientos: selectedSeats });
        renderFloor();
        updateSummary();
      } catch (err) {
        avisar('Sin conexión', 'No pudimos reservar el asiento. Revisa tu internet e inténtalo de nuevo.');
      } finally {
        procesandoAsiento = false;
        marcarPendiente(null);
      }
    }

    // Aviso rápido y no bloqueante (sin botón) cuando tocan un asiento ya ocupado.
    let toastOcupadoTimeout = null;
    let toastOcupadoActual = null;
    function mostrarToastAsientoOcupado(idAsiento) {
      if (toastOcupadoActual) {
        clearTimeout(toastOcupadoTimeout);
        toastOcupadoActual.remove();
      }

      const toast = document.createElement('div');
      toast.className = 'fixed top-4 right-4 z-50 bg-red-600 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg shadow-red-900/40 transition-opacity duration-300 opacity-0';
      toast.textContent = `Asiento ${idAsiento} ocupado`;
      document.body.appendChild(toast);
      toastOcupadoActual = toast;

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0');
      });

      toastOcupadoTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => {
          toast.remove();
          if (toastOcupadoActual === toast) toastOcupadoActual = null;
        }, 300);
      }, 2000);
    }

    function renderFloor() {
      const piso = planoPorPiso[currentFloor];
      busGrid.innerHTML = '';
      busGrid.style.gridTemplateColumns = `repeat(${piso.verticalRows[0].length}, minmax(0, 1fr))`;

      piso.verticalRows.forEach(fila => {
        fila.forEach(cell => {
          const cellDiv = document.createElement('div');

          if (cell.type === 'seat' || cell.type === 'occupied') {
            const isOccupied = cell.type === 'occupied';
            const isSelected = selectedSeats.some(s => s.id === cell.id && s.floor === currentFloor);

            if (isOccupied) {
              cellDiv.className = 'aspect-[4/5] bg-red-500 border border-red-600 rounded-lg flex flex-col items-center justify-center gap-1 cursor-not-allowed';
              cellDiv.innerHTML = `
                <span class="text-sm font-black leading-none text-white">${cell.id}</span>
                <svg class="w-3.5 h-3.5 text-white/80" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path></svg>
              `;
              cellDiv.setAttribute('role', 'img');
              cellDiv.setAttribute('aria-label', `Asiento ${cell.id}, ocupado`);
              cellDiv.addEventListener('click', () => mostrarToastAsientoOcupado(cell.id));
            } else {
              const enProceso = pendiente && pendiente.id === cell.id && pendiente.floor === currentFloor;
              const precio = Number(cell.price || piso.price) || 0;
              cellDiv.className = `aspect-[4/5] rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer transition-all ${enProceso ? 'bg-whatsapp-green/10 border-2 border-dashed border-whatsapp-green animate-pulse' : isSelected ? 'bg-whatsapp-green/20 border-2 border-whatsapp-green' : 'bg-white border border-gray-300 hover:border-whatsapp-green/60'}`;
              cellDiv.innerHTML = enProceso ? `
                <span class="text-sm font-black leading-none text-whatsapp-green">${window.TMT.esc(cell.id)}</span>
                <div class="w-4 h-4 mt-1 rounded-full border-2 border-whatsapp-green/30 border-t-whatsapp-green animate-spin" aria-hidden="true"></div>
              ` : `
                <span class="text-sm font-black leading-none ${isSelected ? 'text-whatsapp-green' : 'text-gray-800'}">${window.TMT.esc(cell.id)}</span>
                ${cell.angle ? `<span class="text-[9px] leading-none ${isSelected ? 'text-whatsapp-green/70' : 'text-gray-500'}">${window.TMT.esc(cell.angle)}°</span>` : ''}
                ${precio ? `<span class="text-[11px] font-bold leading-none ${isSelected ? 'text-whatsapp-green' : 'text-gray-900'}">${soles(precio)}</span>` : ''}
              `;
              cellDiv.setAttribute('role', 'button');
              cellDiv.tabIndex = 0;
              cellDiv.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
              cellDiv.setAttribute('aria-label', `Asiento ${cell.id}${isSelected ? ', elegido' : ', libre'}${precio ? `, ${soles(precio)}` : ''}`);
              // Enviamos el precio base que guardamos
              cellDiv.addEventListener('click', () => toggleSeat(currentFloor, cell.id, precio));
              cellDiv.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSeat(currentFloor, cell.id, precio); }
              });
            }
          } else if (cell.type === 'label') {
            cellDiv.className = 'aspect-[4/5] rounded-lg flex items-center justify-center bg-gray-100/5 border border-gray-700';
            cellDiv.innerHTML = `<span class="text-[10px] font-bold text-gray-400">${cell.text || ''}</span>`;
          } else if (ICONS[cell.type]) {
            cellDiv.className = 'aspect-[4/5] flex items-center justify-center';
            cellDiv.innerHTML = ICONS[cell.type];
          } else {
            // empty / aisle
            cellDiv.className = 'aspect-[4/5]';
          }

          busGrid.appendChild(cellDiv);
        });
      });
    }

    function renderFloorTabs() {
      const pisos = Object.keys(planoPorPiso);
      if (pisos.length <= 1) {
        floorTabs.classList.add('hidden');
        return;
      }
      floorTabs.classList.remove('hidden');
      floorTabsInner.innerHTML = '';
      pisos.forEach(piso => {
        const btn = document.createElement('button');
        const active = piso === currentFloor;
        btn.className = `flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all ${active ? 'bg-whatsapp-green text-black shadow-lg shadow-whatsapp-green/20' : 'text-gray-400'}`;
        btn.textContent = piso === '1' ? '1er Piso' : piso === '2' ? '2do Piso' : `Piso ${piso}`;
        btn.addEventListener('click', () => {
          currentFloor = piso;
          renderFloorTabs();
          renderFloor();
        });
        floorTabsInner.appendChild(btn);
      });
    }

    async function cargarPlano() {
      // 🛠️ CORRECCIÓN: Como armamos el payload exacto en elegir-horario.html, lo enviamos directo
      const payload = booking.viajeSeleccionado;
      // Primera carga: spinner a pantalla. Al refrescar (tras un asiento que
      // ya no estaba), el plano sigue visible mientras se actualiza.
      if (busLayout.classList.contains('hidden')) {
        statusText.textContent = 'Consultando asientos disponibles…';
        statusText.classList.remove('text-red-400');
        statusSpinner.classList.remove('hidden');
        statusMessage.classList.remove('hidden');
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/v1/plano-bus`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const body = await res.json();
        
        if (!res.ok) {
          // Lógica corregida para la obtención del plano
          const errorDetail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
          throw new Error(errorDetail || 'No se pudo obtener el plano del bus.');
        }

        planoPorPiso = body.data || {};
        Object.keys(planoPorPiso).forEach(piso => {
          planoPorPiso[piso].verticalRows = transponerAVertical(planoPorPiso[piso].rows);
        });
        currentFloor = Object.keys(planoPorPiso)[0];

        if (!currentFloor) throw new Error('El bus no tiene asientos configurados.');

        statusMessage.classList.add('hidden');
        busLayout.classList.remove('hidden');
        renderFloorTabs();
        renderFloor();
        updateSummary();
      } catch (err) {
        statusSpinner.classList.add('hidden');
        statusText.textContent = `${err.message} Recarga la página o inténtalo en unos minutos.`;
        statusText.classList.add('text-red-400');
        statusMessage.classList.remove('hidden');
        busLayout.classList.add('hidden');
      }
    }

    document.getElementById('btn-back').addEventListener('click', (e) => {
      e.preventDefault();
      window.history.back();
    });

    // pagehide se dispara en CUALQUIER salida de esta pantalla, incluyendo
    // avanzar normalmente con "Confirmar" — sin esta bandera, el asiento se
    // liberaba en JELAF justo al pasar a rellenar datos/pago, y para cuando
    // el cliente terminaba de llenar todo ya no estaba reservado.
    let confirmado = false;

    confirmBtn.addEventListener('click', () => {
      if (selectedSeats.length === 0) return;
      confirmado = true;
      saveBooking({ asientos: selectedSeats });
      window.location.href = 'datos-pasajeros.html';
    });

    // Si el usuario sale de la pantalla sin confirmar (volver atrás, cerrar la
    // pestaña, etc.), liberamos el worker completo (todos sus asientos a la
    // vez) para que no quede atascado para el siguiente cliente. keepalive
    // permite que la petición termine aunque la pestaña ya se esté cerrando.
    //
    // OJO: no se puede condicionar esto a `ventaIniciada` (la bandera LOCAL
    // de esta pantalla) — desde que /iniciar se dispara en elegir-horario.html antes de
    // llegar acá (prefetch), el worker puede estar reservado en el backend
    // aunque el cliente nunca haya llegado a tocar un asiento en ESTA
    // pantalla. Cancelar cuando no hay nada que cancelar es inofensivo (el
    // backend responde "success" igual), así que siempre se intenta.
    window.addEventListener('pagehide', () => {
      if (confirmado) return;
      fetch(`${API_BASE_URL}/api/v2/venta/cancelar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_id: bookingId }),
        keepalive: true
      }).catch(() => {});
    });

    sincronizarConServidor().finally(cargarPlano);
  </script>
